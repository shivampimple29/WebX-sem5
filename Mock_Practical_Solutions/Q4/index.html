<!DOCTYPE html>
<html lang="en" ng-app="helloApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AngularJS Hello World - Shivam Pimple</title>
  <!-- AngularJS CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f2f5] text-gray-800 p-6 flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-lg p-6" ng-controller="HelloController">
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">{{ greeting }}</h1>
      <p class="text-sm text-gray-500 mt-1">AngularJS Two-Way Data Binding Demonstration</p>
    </header>

    <div class="space-y-4">
      <!-- Two-way data binding input -->
      <div>
        <label for="nameInput" class="block text-sm font-medium text-gray-700 mb-1">Enter Your Name:</label>
        <input
          type="text"
          id="nameInput"
          ng-model="userName"
          placeholder="Type a name..."
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-600 text-sm"
        >
      </div>

      <!-- Real-time text display via expression -->
      <div class="p-4 bg-gray-50 border border-gray-200 rounded-md">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Real-Time Output (Expression):</p>
        <p class="text-lg font-medium text-gray-800">
          Hello, <span class="text-blue-600 font-bold">{{ userName || 'World' }}</span>!
        </p>
      </div>
    </div>

    <footer class="mt-6 pt-4 border-t border-gray-200 text-center text-xs text-gray-500">
      &copy; 2026 Shivam Pimple | Contact: shivampimple29@student.sfit.ac.in
    </footer>
  </div>

  <script>
    // Define AngularJS Module
    var app = angular.module("helloApp", []);

    // Define Controller for State Management
    app.controller("HelloController", function ($scope) {
      $scope.greeting = "Hello World!";
      $scope.userName = "Shivam Pimple";
    });
  </script>
</body>
</html>
