<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Validation - Shivam Pimple</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f2f5] text-gray-800 p-6 flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-lg p-6">
    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">User Registration</h1>
      <p class="text-sm text-gray-500 mt-1">Client-side validation with JavaScript & Regex</p>
    </header>

    <!-- Success Feedback Alert -->
    <div id="successMessage" class="hidden mb-4 p-3 bg-green-50 border border-green-300 text-green-700 text-sm rounded-md">
      Registration successful! Password meets all criteria.
    </div>

    <form id="registrationForm" novalidate class="space-y-4">
      <!-- Full Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Shivam Pimple"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-600 text-sm"
        >
        <p id="nameError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="shivampimple29@student.sfit.ac.in"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-600 text-sm"
        >
        <p id="emailError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter strong password"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-600 text-sm"
        >
        <p id="passwordError" class="text-red-500 text-xs mt-1 hidden"></p>
        <p class="text-gray-400 text-xs mt-1">Criteria: Minimum 8 characters, at least 1 number, and 1 uppercase letter.</p>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-md hover:bg-blue-700 transition-colors text-sm mt-2"
      >
        Register
      </button>
    </form>

    <footer class="mt-6 pt-4 border-t border-gray-200 text-center text-xs text-gray-500">
      &copy; 2026 Shivam Pimple | Contact: shivampimple29@student.sfit.ac.in
    </footer>
  </div>

  <script>
    const form = document.getElementById("registrationForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const nameError = document.getElementById("nameError");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function (e) {
      // Prevent default page reload
      e.preventDefault();

      let isValid = true;
      resetErrors();

      const nameVal = nameInput.value.trim();
      const emailVal = emailInput.value.trim();
      const passwordVal = passwordInput.value;

      // Name Validation
      if (nameVal === "") {
        showError(nameInput, nameError, "Please enter your name.");
        isValid = false;
      }

      // Email Validation using Regex
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (emailVal === "") {
        showError(emailInput, emailError, "Please enter your email address.");
        isValid = false;
      } else if (!emailRegex.test(emailVal)) {
        showError(emailInput, emailError, "Please enter a valid email address.");
        isValid = false;
      }

      // Password Validation using Control Structures & Regular Expressions
      const hasUppercase = /[A-Z]/;
      const hasNumber = /[0-9]/;

      if (passwordVal === "") {
        showError(passwordInput, passwordError, "Password is required.");
        isValid = false;
      } else if (passwordVal.length < 8) {
        showError(passwordInput, passwordError, "Password must be at least 8 characters long.");
        isValid = false;
      } else if (!hasUppercase.test(passwordVal)) {
        showError(passwordInput, passwordError, "Password must contain at least one uppercase letter (A-Z).");
        isValid = false;
      } else if (!hasNumber.test(passwordVal)) {
        showError(passwordInput, passwordError, "Password must contain at least one number (0-9).");
        isValid = false;
      }

      // If all inputs pass validation
      if (isValid) {
        successMessage.classList.remove("hidden");
        form.reset();
      }
    });

    function showError(inputElement, errorElement, message) {
      inputElement.classList.add("border-red-500");
      inputElement.classList.remove("border-gray-300");
      errorElement.textContent = message;
      errorElement.classList.remove("hidden");
    }

    function resetErrors() {
      successMessage.classList.add("hidden");

      [nameInput, emailInput, passwordInput].forEach((input) => {
        input.classList.remove("border-red-500");
        input.classList.add("border-gray-300");
      });

      [nameError, emailError, passwordError].forEach((err) => {
        err.classList.add("hidden");
        err.textContent = "";
      });
    }
  </script>
</body>
</html>
