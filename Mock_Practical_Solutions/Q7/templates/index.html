<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flask POST Form - Shivam Pimple</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f2f5] text-gray-800 p-6 flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-lg p-6">
    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Flask Data Submission</h1>
      <p class="text-sm text-gray-500 mt-1">Submit via Form or Thunder Client POST</p>
    </header>

    <form action="/" method="POST" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          value="Shivam Pimple"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-600 text-sm"
        >
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          value="shivampimple29@student.sfit.ac.in"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-600 text-sm"
        >
      </div>

      <div>
        <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
        <textarea
          id="message"
          name="message"
          rows="3"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-600 text-sm"
        >Full-Stack Development with Flask & Python</textarea>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-md hover:bg-blue-700 transition-colors text-sm"
      >
        Send POST Request
      </button>
    </form>

    <footer class="mt-6 pt-4 border-t border-gray-200 text-center text-xs text-gray-500">
      &copy; 2026 Shivam Pimple | Contact: shivampimple29@student.sfit.ac.in
    </footer>
  </div>
</body>
</html>
